name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Tests run on the OS the release ships for. Two Daemon tests fail on
    # Linux file watching, which is tracked separately before any Linux build.
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: tenaza-darwin-arm64
          - target: bun-darwin-x64
            asset: tenaza-darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Cross-compile ${{ matrix.target }}
        run: bun build ./src/cli.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # First, and nothing else before it: `actions/checkout` defaults to
      # `clean: true` (a `git clean -ffdx` before checking out), which would
      # otherwise erase the artifacts a later step downloads into this same
      # workspace. Checking out here, before anything is downloaded, needs
      # no `clean: false` override to stay safe.
      - name: Checkout (for CHANGELOG.md and scripts/)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts and compute checksums
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in dist/*/; do
            asset="$(basename "$dir")"
            cp "$dir/$asset" "release/$asset"
            chmod +x "release/$asset"
          done
          (cd release && sha256sum -- * > checksums.txt)
          cat release/checksums.txt

      - name: Extract this tag's own release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          scripts/extract-changelog.sh "$version" > release/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/tenaza-darwin-arm64
            release/tenaza-darwin-x64
            release/checksums.txt
          body_path: release/notes.md
          generate_release_notes: true

      # The release above is already published by the time this runs, so a
      # failure here is purely a fallback case, never a reason to touch the
      # release itself: this step only opens a PR, it never pushes to main
      # directly. Branches from origin/main (never the tag's own detached
      # commit the earlier steps checked out) because that is what the PR
      # targets. Reuses packaging/homebrew/update-formula.sh rather than
      # re-implementing its hash-filling logic in YAML.
      - name: Open the formula PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          branch="chore/formula-${version}"

          git fetch origin main:refs/remotes/origin/main
          git checkout -b "$branch" origin/main

          packaging/homebrew/update-formula.sh "$version"

          # A re-run of this job for a version already landed on main (the
          # PR already merged, or the script already a no-op) must not
          # create an empty commit or a duplicate PR — exit clean instead.
          if git diff --quiet -- Formula/tenaza.rb; then
            echo "Formula/tenaza.rb already points at v${version} on main — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Formula/tenaza.rb
          git commit -m "chore: point the formula at v${version}"
          git push origin "$branch"

          gh pr create \
            --base main \
            --title "chore: point the formula at v${version}" \
            --body "Opened automatically by the release run that published v${version} (run ${GITHUB_RUN_ID}). \`Formula/tenaza.rb\` filled by \`packaging/homebrew/update-formula.sh ${version}\` from this release's own checksums.txt."
