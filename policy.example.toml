# Tenaza's starter Policy (q6, q10, q16). `tenaza init` copies this file
# VERBATIM to ~/.tenaza/config/policy.toml the first time it runs — never
# again once that file exists. It is yours from that point on: edit it
# freely, Tenaza never reads this shipped copy again.
#
# A `shell` Rule (`match = "…"`) parses the command with tree-sitter-bash
# and looks for its words as a CONTIGUOUS RUN anywhere in a command the
# line actually executes (ticket 03, ADR 0006) — `timeout 60 gh pr merge
# 58` and `sudo gh pr merge 58` both match with no launcher table to keep
# current, while a quoted string, a heredoc body or a commit message that
# only MENTIONS the words never does. `bash`/`sh`/`zsh -c` strings and
# `eval` are re-parsed; `$(...)` and backticks are commands, wherever they
# sit. A line that fails to parse (an unterminated quote, zsh-only syntax)
# falls back to the old plain-substring check (`match` in
# `command.includes(...)`) instead of going silent.
#
# An `mcp` Rule (`tool = "…"`, ticket 04, decision 07) matches an MCP tool
# call by NAME — a glob where `*` is the only wildcard, e.g.
# "mcp__*neon*__run_sql*" — with optional conditions on its arguments:
# `unless = { <arg path> = [safe values] }` exempts the call when an
# argument holds one of those values — an ABSENT argument is NEVER safe,
# it still matches (e.g. a Neon `run_sql` with no `branch_id` hits the
# default branch, which is prod); `when = { <arg path> = value }` requires
# the argument to equal it. Dotted paths reach nested arguments; an array
# argument matches if ANY element does. No per-provider code — a Rule for
# an MCP a project lacks simply never matches — and SQL or other argument
# CONTENT is never inspected, only these two structural conditions.
#
# Either kind: the FIRST matching [[rule]] in file order wins. A guardrail
# against honest agent mistakes, never a security boundary — a determined
# agent (or a differently-worded command) can walk around any Rule here.
#
# Known misses for `shell` Rules — none of these are caught, on purpose: no
# per-launcher table, no variable tracking, no re-running a written file.
#   - `ssh host "gh pr merge 58"` — the remote command is one quoted
#     string, data to the local shell.
#   - `C=gh; $C pr merge 58` — variable indirection.
#   - a script written to a file, then run (e.g. `./deploy.sh`).
#   - `git -C some/dir worktree remove x` — an interleaved global flag
#     breaks the contiguous run (`git`, then `-C dir`, only THEN
#     `worktree remove` — never a run of exactly `git worktree remove`).
# Known rare false positive: an UNQUOTED `echo gh pr merge` is itself a
# real command whose argv literally contains the words in order — there is
# nothing left to tell that apart from a deliberate one.

[[rule]]
# Yunque's PR-merge seam (skills/_shared/execution-convention.md): landing a
# PR is reserved for the human.
match = "gh pr merge"
effect = "human"

[[rule]]
# Yunque's worktree-cleanup seam: removing a worktree is reserved for the
# human.
match = "git worktree remove"
effect = "human"

# Everything below is commented out: v0.2 ships with ONLY the two Rules
# above active ("se frena lo que se frena hoy, nada más" — Tenaza must not
# get in your way; it blocks only what already needs you). Uncomment and
# adjust whichever of these you actually use — each is a BEST GUESS at a
# shape, not a working default.

# [[rule]]
# # Neon: running SQL with no branch_id at all hits the DEFAULT branch,
# # which is production. Adjust the tool glob if your Neon MCP server
# # names this tool differently, and the safe list to your own dev/staging
# # branch ids.
# tool = "mcp__*neon*__run_sql*"
# unless = { branch_id = ["br-dev-example", "br-staging-example"] }
# effect = "human"

# [[rule]]
# # Vercel: promoting a deployment to production. Adjust the tool glob to
# # however your Vercel MCP server names it.
# tool = "mcp__*vercel*__request_promote*"
# effect = "human"

# [[rule]]
# # Railway: running a command against the production environment via its
# # CLI. BEST GUESS — assumes you name the environment explicitly on the
# # command itself (`railway run --environment production ...`). If you
# # instead switch the linked environment first
# # (`railway environment production`) and then run a bare `railway run
# # ...`, THIS RULE WILL NOT CATCH IT — adjust the string to however you
# # actually invoke a prod run.
# match = "railway run --environment production"
# effect = "human"

[flag]
# The context size (tokens) past which a Session is Flagged in `status` and
# `statusline` — shown, never enforced (q9). 200k is the shipped default;
# uncomment and change it to override. The Live surface (ticket 08) marks
# the same threshold on its context track.
# threshold_tokens = 200000

[live]
# Minutes a Session may go silent (no Event at all) before the Live surface
# shows it as TRABADA instead of CORRIENDO (ticket 08, decision 04). 15 is
# the shipped default; uncomment and change it to override. Only the Daemon
# reads this — no hook depends on it (decision 05).
# stall_minutes = 15

# Seconds a `human` match holds the agent's call for a live answer before
# it lapses to pending, same as v0.1's deny + Inbox (ticket 10, decision
# 06). 180 (3 minutes) is the shipped default; uncomment and change it to
# override — the hold itself never waits longer than the hook's own
# timeout budget allows (240s minus a 30s margin = 210s), whatever you set
# here.
# wait_seconds = 180
